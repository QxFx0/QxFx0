name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1'  # Weekly: Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: 'Contract profile to run'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - extended

env:
  LD_LIBRARY_PATH: /tmp/gf-install/usr/lib
  QXFX0_CABAL_LOCK_FILE: /tmp/qxfx0-cabal.lock

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Job 1: Core Contract (push/PR, 16 GB compatible)
  # ═══════════════════════════════════════════════════════════════════════
  core-contract:
    name: Core Contract (PROD_GO)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.profile == 'core' || github.event.inputs.profile == 'extended'))
    env:
      QXFX0_CONTRACT_PROFILE: core
      QXFX0_RUN_SLOW_TESTS: 0
      QXFX0_ENABLE_COVERAGE_GATE: 0
      QXFX0_RELEASE_SMOKE_MODE: degraded-local
      QXFX0_GF_RUNTIME: 1
      # GF C runtime built into /tmp/gf-install; help gcc/ld + runtime find it.
      LIBRARY_PATH: /tmp/gf-install/usr/lib
      C_INCLUDE_PATH: /tmp/gf-install/usr/include
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libsqlite3-dev

      - name: Build GF C runtime (libpgf/libgu)
        run: |
          set -euo pipefail
          git clone https://github.com/GrammaticalFramework/gf-core.git /tmp/gf-core
          git -C /tmp/gf-core checkout 1c086bed25811db1cf71990fb2eeca023e62c060
          cd /tmp/gf-core/src/runtime/c
          # Newer libtool rejects ACLOCAL_AMFLAGS alongside AC_CONFIG_MACRO_DIRS;
          # drop the redundant flag so autoreconf works across autotools versions.
          sed -i '/^ACLOCAL_AMFLAGS/d' Makefile.am || true
          autoreconf -i
          ./configure --prefix=/tmp/gf-install/usr
          make -j"$(nproc)"
          make install

      - name: Configure cabal for CI GF runtime
        run: |
          # extra-lib-dirs must apply to the pgf2 *dependency* too, so use a
          # `package *` stanza (top-level extra-lib-dirs does not reach deps).
          # -O0 keeps the gate fast (it checks that the tree builds + tests pass,
          # not runtime perf); the 20k-lemma module is very slow to optimize.
          cat > cabal.project.local <<'EOF'
          optimization: 0
          package *
            extra-lib-dirs: /tmp/gf-install/usr/lib
            extra-include-dirs: /tmp/gf-install/usr/include
          package qxfx0
            ghc-options: -optl-Wl,-rpath,/tmp/gf-install/usr/lib
          EOF

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'qxfx0.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python unit tests
        run: python3 -m unittest discover -s test -p 'test_*.py'

      - name: Generate morphology artifacts
        run: |
          # forms_by_surface.json / lexicon.db are gitignored (large, generated);
          # regenerate from tracked lexicon source so runtime init + lexicon
          # tests can resolve resources/morphology/*.
          python3 scripts/export_lexicon.py

      - name: Cabal update
        run: cabal update

      - name: Core gate contract
        run: bash scripts/ci_gate_contract.sh

      - name: Upload core gate logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-gate-logs-${{ github.run_id }}
          path: |
            reports/baseline_v2/final_gates/_gate_results_*.md
            reports/baseline_v2/final_gates/*.log

  # ═══════════════════════════════════════════════════════════════════════
  # Job 2: Extended Contract (nightly/weekly + manual dispatch + main only)
  # ═══════════════════════════════════════════════════════════════════════
  extended-contract:
    name: Extended Contract (FULL_SCIENTIFIC_GO)
    # NOTE: This job requires a high-memory runner (>=32 GB RAM).
    # Configure a self-hosted or larger runner label accordingly.
    runs-on: high-mem
    timeout-minutes: 45
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'extended')
    # NOTE: Push-to-main trigger removed because the high-mem runner
    # (>=32 GB RAM) is not guaranteed to be available on every push.
    # Extended contract runs only on scheduled weekly cron + manual
    # workflow_dispatch.  See docs/EXTENDED_CONTRACT_RUNBOOK.md.
    needs: core-contract
    env:
      QXFX0_CONTRACT_PROFILE: extended
      QXFX0_RUN_SLOW_TESTS: 1
      QXFX0_ENABLE_COVERAGE_GATE: 1
      QXFX0_REQUIRE_STRICT_RUNTIME: 1
      QXFX0_RELEASE_SMOKE_MODE: strict
      QXFX0_SKIP_AGDA: 0
      QXFX0_GF_RUNTIME: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10'

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'qxfx0.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Install Python dependencies & spaCy model
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          python3 -m spacy download ru_core_news_sm || true

      - name: Python unit tests
        run: python3 -m unittest discover -s test -p 'test_*.py'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y agda agda-stdlib gf libsqlite3-dev souffle

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cabal update
        run: cabal update

      - name: Extended gate contract
        run: bash scripts/ci_gate_contract.sh

      - name: Upload extended gate logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-gate-logs-${{ github.run_id }}
          path: |
            reports/baseline_v2/final_gates/_gate_results_*.md
            reports/baseline_v2/final_gates/_gate_results_*.tsv
