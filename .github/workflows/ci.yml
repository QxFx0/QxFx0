name: CI

on:
  push:
    branches: [main, master, feature/glm-fixes-audit-round1]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1'  # Weekly: Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: 'Contract profile to run'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - extended

env:
  LD_LIBRARY_PATH: /tmp/gf-install/usr/lib
  QXFX0_CABAL_LOCK_FILE: /tmp/qxfx0-cabal.lock

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Job 1: Core Contract (push/PR, 16 GB compatible)
  # ═══════════════════════════════════════════════════════════════════════
  core-contract:
    name: Core Contract (PROD_GO)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'core')
    env:
      QXFX0_CONTRACT_PROFILE: core
      QXFX0_RUN_SLOW_TESTS: 0
      QXFX0_ENABLE_COVERAGE_GATE: 0
      QXFX0_RELEASE_SMOKE_MODE: degraded-local
      QXFX0_GF_RUNTIME: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10'

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'qxfx0.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cabal update
        run: cabal update

      - name: Core gate contract
        run: bash scripts/ci_gate_contract.sh

      - name: Upload core gate logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-gate-logs-${{ github.run_id }}
          path: reports/baseline_v2/final_gates/_gate_results_*.md

  # ═══════════════════════════════════════════════════════════════════════
  # Job 2: Extended Contract (nightly/weekly + manual dispatch + main only)
  # ═══════════════════════════════════════════════════════════════════════
  extended-contract:
    name: Extended Contract (FULL_SCIENTIFIC_GO)
    # NOTE: This job requires a high-memory runner (>=32 GB RAM).
    # Configure a self-hosted or larger runner label accordingly.
    runs-on: high-mem
    timeout-minutes: 45
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'extended') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: core-contract
    env:
      QXFX0_CONTRACT_PROFILE: extended
      QXFX0_RUN_SLOW_TESTS: 1
      QXFX0_ENABLE_COVERAGE_GATE: 1
      QXFX0_REQUIRE_STRICT_RUNTIME: 1
      QXFX0_RELEASE_SMOKE_MODE: strict
      QXFX0_SKIP_AGDA: 0
      QXFX0_GF_RUNTIME: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10'

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'qxfx0.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Install Python dependencies & spaCy model
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          python3 -m spacy download ru_core_news_sm || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y agda agda-stdlib gf libsqlite3-dev souffle

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cabal update
        run: cabal update

      - name: Extended gate contract
        run: bash scripts/ci_gate_contract.sh

      - name: Upload extended gate logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-gate-logs-${{ github.run_id }}
          path: |
            reports/baseline_v2/final_gates/_gate_results_*.md
            reports/baseline_v2/final_gates/_gate_results_*.tsv

  # ═══════════════════════════════════════════════════════════════════════
  # Legacy fast-gates job (kept for granular step visibility on PRs)
  # ═══════════════════════════════════════════════════════════════════════
  build-test:
    name: Build & Fast Gates (granular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10'

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'qxfx0.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cabal update
        run: cabal update

      - name: Cabal build
        run: cabal build all --extra-lib-dirs=/tmp/gf-install/usr/lib

      - name: Cabal test (fast)
        run: cabal test qxfx0-test-fast --extra-lib-dirs=/tmp/gf-install/usr/lib

      - name: Cabal test (unit)
        run: cabal test qxfx0-test-unit --extra-lib-dirs=/tmp/gf-install/usr/lib

      - name: Cabal test (property)
        run: cabal test qxfx0-test-property --extra-lib-dirs=/tmp/gf-install/usr/lib

      - name: Cabal test (integration)
        run: cabal test qxfx0-test-integration --extra-lib-dirs=/tmp/gf-install/usr/lib

      - name: Cabal check
        run: cabal check

      - name: Architecture boundary check
        run: bash scripts/check_architecture.sh

      - name: Schema contract check
        run: python3 scripts/check_schema_contract.py

      - name: Schema consistency check
        run: python3 scripts/check_schema_consistency.py

      - name: Agda/Haskell constructor sync check
        run: python3 scripts/verify_agda_sync.py

      - name: Lexicon contour check
        run: bash scripts/check_lexicon.sh

      - name: Generated artifacts drift check
        run: bash scripts/check_generated_artifacts.sh

      - name: GF quality gate
        run: bash scripts/gf_quality_gate.sh

      - name: Haddock module header check
        run: bash scripts/check_haddock.sh
